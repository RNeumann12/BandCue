name: CI

on:
  push:
    # Branches only: a release tag points at a commit main has already tested.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or PR supersedes the run in progress; every commit
# on main still gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json engines: >=20.
        node: [20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  windows:
    # The host, the MuseScore helper and the double-click launchers run on
    # Windows, and the release bundle is built there.
    name: Windows host and release package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The launchers run these with powershell.exe, i.e. Windows PowerShell 5.1.
      - name: Parse the PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          $files = @(Get-ChildItem scripts -Filter *.ps1)
          if ($files.Count -eq 0) { Write-Output "::error::No scripts/*.ps1 found"; exit 1 }
          foreach ($file in $files) {
            Write-Output "Parsing scripts/$($file.Name)"
            $problems = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$problems)
            foreach ($problem in $problems) {
              Write-Output "::error file=scripts/$($file.Name),line=$($problem.Extent.StartLineNumber),col=$($problem.Extent.StartColumnNumber)::$($problem.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      # Without the APK, which needs the maintainer's release keystore. verify
      # already ran, so call the script directly instead of npm run package:release.
      - name: Package the release
        run: npx tsx src/tools/package-release.ts --skip-android
      # Packaging regenerates the icons from assets/brand/bandcue-icon.svg.
      - name: Check the committed icons are up to date
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          path: dist/release/bandcue-v*.zip
          archive: false
          retention-days: 14

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # WebKit runs the score view at iPad size (playwright.config.ts).
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      # Screenshots, error context and retry traces of failed or flaky tests.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  pi-node18:
    # The Raspberry Pi coordinator is pinned to Node 18 (Raspbian Buster cannot
    # run the official Node 20+ armv7l builds), while the dev tooling needs 20+.
    # Build with a current Node, then run the built coordinator on Node 18.
    name: Coordinator smoke test (Node 18, Pi)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck the Pi deploy script
        run: shellcheck --severity=warning scripts/*.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: node scripts/smoke-coordinator.mjs

  android:
    name: Android unit tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # The repo intentionally ships no Gradle wrapper (see scripts/
      # build-android.ps1, which bootstraps the same version locally).
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
          # The open-source actions/cache provider, as in v4; v6 defaults to a
          # proprietary one.
          cache-provider: basic
      - run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: android/app/build/reports/
          retention-days: 14
